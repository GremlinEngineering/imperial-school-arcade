<text x="310.0" y="363.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#243a2e">Подготовленные</text>
<text x="310.0" y="387.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#243a2e">задачи редакции</text>
