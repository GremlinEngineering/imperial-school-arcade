<text x="310.0" y="962.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243a2e">Индексы и граф существующих объектов</text>
<text x="310.0" y="986.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243a2e">Новый игровой опыт возвращается в цикл</text>
