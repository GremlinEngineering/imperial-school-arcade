<text x="310.0" y="183" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#243a2e">Подтверждённые объекты</text>
<text x="310.0" y="215.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#243a2e">Версии, роли карточек, серии и источники</text>
