<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 1050" role="img" aria-labelledby="title desc"><title id="title">Общий цикл Аркадного зала</title><desc id="desc">Наблюдения, справка и авторские записи связываются с версиями игр. Правила, модель и готовые авторские материалы дают разные результаты. Реестр сущностей и локальный NLP связывают текст с объектами перед публикацией.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52665d"/></marker></defs><rect width="620" height="1050" rx="18" fill="#fbfbf7"/>
<rect x="85" y="25" width="450" height="88" rx="12" fill="#f0f1ed" stroke="#87968d" stroke-width="1.6"/>
<text x="310.0" y="53" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#243a2e">Наблюдения и материалы</text>
<text x="310.0" y="85.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#243a2e">Игровые данные, справка, записи автора</text>
