<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1050" role="img" aria-labelledby="title desc"><title id="title">Движки и контуры Аркадного зала</title><desc id="desc">Данные и авторские материалы проходят проверку идентичности; смысловые, медийные и событийные контуры готовят материалы, которые темы и каталог связывают при статической публикации.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52665d"/></marker></defs><rect width="1500" height="1050" rx="18" fill="#fbfbf7"/>
