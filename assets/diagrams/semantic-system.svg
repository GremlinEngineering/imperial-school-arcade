<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1200" role="img" aria-labelledby="title desc"><title id="title">Полная карта смыслового движка</title><desc id="desc">Источники и подтверждённые версии питают эвристики, отслеживание изменений и подготовку контекста. Далее работают семейства смысловых генераторов. Результаты сохраняются, проходят движок сущностей и публикуются вместе с индексами и картой журнала.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52665d"/></marker></defs><rect width="1500" height="1200" rx="18" fill="#fbfbf7"/>
