<text x="380.0" y="86.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#243a2e">Профиль, версии и прошлые состояния</text>
<rect x="25" y="180" width="330" height="130" rx="12" fill="#f6efdc" stroke="#a18b54" stroke-width="1.6"/>
<text x="190.0" y="208" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243a2e">Отбор и ограничения</text>
<text x="190.0" y="237.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243a2e">Три направления рекомендаций</text>
<text x="190.0" y="261.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243a2e">Исключения, слоты, ротация</text>
<text x="190.0" y="285.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243a2e">Подборки тем и признание</text>
<path d="M380 115V145H190V180" fill="none" stroke="#52665d" stroke-width="1.8" marker-end="url(#arrow)"/>
