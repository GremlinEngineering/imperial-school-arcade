<text x="570.0" y="249.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243a2e">Время, жанры и точные механики</text>
<text x="570.0" y="273.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243a2e">Портрет, черты и подтверждения</text>
