<rect x="25" y="370" width="330" height="130" rx="12" fill="#f6efdc" stroke="#a18b54" stroke-width="1.6"/>
<text x="190.0" y="398" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243a2e">События и состояние</text>
<text x="190.0" y="439.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243a2e">Разницы наблюдений и полнота</text>
