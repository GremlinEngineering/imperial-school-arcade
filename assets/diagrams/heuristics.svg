<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" role="img" aria-labelledby="title desc"><title id="title">Эвристики Аркадного зала</title><desc id="desc">Общие наблюдения и подтверждённые идентичности обрабатываются независимыми правилами отбора, аналитики, событий и обновления материалов. Их результаты поступают в контекст задач и публикацию.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52665d"/></marker></defs><rect width="760" height="700" rx="18" fill="#fbfbf7"/>
<rect x="135" y="25" width="490" height="90" rx="12" fill="#f0f1ed" stroke="#87968d" stroke-width="1.6"/>
