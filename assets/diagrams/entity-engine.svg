<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 1000" role="img" aria-labelledby="title desc"><title id="title">Движок сущностей</title><desc id="desc">Публикуемые объекты дают реестр имён. Локальная сегментация, леммы и синтаксис разрешают упоминания. Неоднозначные места сохраняют исходный текст. Реестр также используется в структурированных метаданных.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52665d"/></marker></defs><rect width="620" height="1000" rx="18" fill="#fbfbf7"/>
