<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 910" role="img" aria-labelledby="title desc"><title id="title">Контекст между редакционными блоками</title><desc id="desc">Недельный и личный взгляды одной версии дают синтез. История и место игры в серии читают готовый контекст. Фонд сохранённых текстов даёт материал обзору серии и признанию, а готовые результаты возвращаются в него.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52665d"/></marker></defs><rect width="1000" height="910" rx="18" fill="#fbfbf7"/>
<rect x="260" y="20" width="480" height="90" rx="12" fill="#f0f1ed" stroke="#87968d" stroke-width="1.6"/>
<text x="500.0" y="48" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#243a2e">Подтверждённые факты и связи</text>
<text x="500.0" y="81.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#243a2e">Версия, состав серий, источники признания</text>
<rect x="20" y="170" width="280" height="95" rx="12" fill="#e5edf5" stroke="#6988a3" stroke-width="1.6"/>
<text x="160.0" y="198" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243a2e">Недельный «Взгляд»</text>
<text x="160.0" y="234.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243a2e">Первое описание выпуска</text>
<path d="M500 110V140H160V170" fill="none" stroke="#52665d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="360" y="170" width="280" height="95" rx="12" fill="#e5edf5" stroke="#6988a3" stroke-width="1.6"/>
<text x="500.0" y="198" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243a2e">Личный «Взгляд»</text>
<text x="500.0" y="234.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243a2e">Игровые опоры и опыт</text>
<path d="M500 110V140H500V170" fill="none" stroke="#52665d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700" y="170" width="280" height="95" rx="12" fill="#e5edf5" stroke="#6988a3" stroke-width="1.6"/>
<text x="840.0" y="198" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243a2e">Справочные «Взгляды»</text>
<text x="840.0" y="234.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243a2e">Участники серий</text>
<path d="M500 110V140H840V170" fill="none" stroke="#52665d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="345" width="280" height="110" rx="12" fill="#e5edf5" stroke="#6988a3" stroke-width="1.6"/>
<text x="160.0" y="373" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#243a2e">Синтез двух взглядов</text>
<text x="160.0" y="404.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243a2e">Та же версия и платформа</text>
<text x="160.0" y="428.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243a2e">Два готовых текста</text>
<rect x="360" y="345" width="280" height="110" rx="12" fill="#e5edf5" stroke="#6988a3" stroke-width="1.6"/>
<text x="500.0" y="373" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#243a2e">История игры</text>
<text x="500.0" y="404.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243a2e">Личный взгляд и факты</text>
<text x="500.0" y="428.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243a2e">Уже раскрытый контекст</text>
<rect x="700" y="345" width="280" height="110" rx="12" fill="#e5edf5" stroke="#6988a3" stroke-width="1.6"/>
<text x="840.0" y="373" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#243a2e">Место в серии</text>
<text x="840.0" y="404.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243a2e">Взгляд, опоры и история</text>
<text x="840.0" y="428.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243a2e">Подтверждённые серии</text>
<path d="M160 265V345" fill="none" stroke="#52665d" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M500 265V300H160V345" fill="none" stroke="#52665d" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M500 265V345" fill="none" stroke="#52665d" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M500 300H840V345" fill="none" stroke="#52665d" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M640 400H700" fill="none" stroke="#52665d" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M160 455V495H500" fill="none" stroke="#52665d" stroke-width="1.5"/>
<path d="M500 455V495H500" fill="none" stroke="#52665d" stroke-width="1.5"/>
<path d="M840 455V495H500" fill="none" stroke="#52665d" stroke-width="1.5"/>
<path d="M500 495V535" fill="none" stroke="#52665d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="200" y="535" width="600" height="105" rx="12" fill="#e4efe7" stroke="#57806a" stroke-width="1.6"/>
<text x="500.0" y="563" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#243a2e">Фонд сохранённых материалов</text>
<text x="500.0" y="592.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#243a2e">Взгляды, история, место в серии, заметки</text>
<text x="500.0" y="616.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#243a2e">Каждый блок сохраняет собственное основание</text>
<path d="M980 217H995V585H800" fill="none" stroke="#52665d" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M330 535V400H360" fill="none" stroke="#52665d" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M800 585H985V315H840V345" fill="none" stroke="#52665d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="200" y="725" width="280" height="120" rx="12" fill="#e5edf5" stroke="#6988a3" stroke-width="1.6"/>
<text x="340.0" y="753" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#243a2e">«Взгляд» серии</text>
<text x="340.0" y="789.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243a2e">Состав и готовые тексты</text>
<text x="340.0" y="813.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243a2e">участников этой серии</text>
<rect x="520" y="725" width="280" height="120" rx="12" fill="#e5edf5" stroke="#6988a3" stroke-width="1.6"/>
<text x="660.0" y="753" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#243a2e">«За что её помнят»</text>
<text x="660.0" y="789.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243a2e">Признание личной версии</text>
<text x="660.0" y="813.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243a2e">и имеющиеся разделы</text>
<path d="M500 640V680H340V725" fill="none" stroke="#52665d" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M500 680H660V725" fill="none" stroke="#52665d" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M200 785H180V585H200" fill="none" stroke="#52665d" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M800 785H820V585H800" fill="none" stroke="#52665d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="500" y="879" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#243a2e">Генераторы читают сохранённые блоки. Основание запуска у каждой задачи своё.</text>
</svg>
